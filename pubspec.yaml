name: cal_tracker
description: "The Witcher's Diet - a gamified food, activity and body tracker that seals the verdict until week's end."
publish_to: 'none'
version: 1.0.6+7

environment:
  sdk: ^3.11.4

# NOTE ON CONSTRAINTS
# Flutter 3.41.6 pins `meta` to 1.17.0, which caps `analyzer` and therefore
# `drift_dev` at 2.34.x. drift >= 2.35.0 cannot be used until the Flutter SDK
# is upgraded (which would also unlock flutter_riverpod >= 3.4.1, needs Dart 3.12).
# Keep drift and drift_dev on the same 2.34.x line.

dependencies:
  flutter:
    sdk: flutter

  # --- state ---
  flutter_riverpod: ^2.6.1

  # --- persistence ---
  drift: ">=2.34.0 <2.35.0"
  sqlite3: ^3.5.2
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.1.1

  # --- network / AI / food data ---
  dio: ^5.11.1
  openfoodfacts: ^3.30.2

  # --- capture ---
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1

  # --- activity ---
  health: ^13.3.2

  # --- ui ---
  fl_chart: ^1.2.0
  cupertino_icons: ^1.0.8

  # --- util ---
  intl: ^0.20.3
  collection: ^1.19.1
  # All 'now' reads go through clock.now() so tests can freeze the calendar.
  clock: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ">=2.34.0 <2.35.0"
  build_runner: ^2.15.1
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/data/

  fonts:
    # Variable fonts (wght axis). Weights are applied at runtime with
    # TextStyle.fontVariations -> FontVariation('wght', n). See lib/theme/.
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel.ttf
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond.ttf
        - asset: assets/fonts/EBGaramond-Italic.ttf
          style: italic
